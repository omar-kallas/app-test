name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors as annotations (several, so long lists aren't cut off).
          grep -E '^e: |What went wrong|error:|Exception' build.log | grep -v '^> Task' | head -150 \
            | sed -e 's/%/%25/g' -e 's#file:///home/runner/work/[^/]*/[^/]*/##' > errors.txt || true
          split -l 15 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(awk '{printf "%s%%0A", $0}' "$f")
            echo "::error title=Build errors ($f)::${msg}"
          done

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Inkfield-0.1.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Inkfield-0.1.${{ github.run_number }}
          path: out/*.apk
          if-no-files-found: error

      - name: Publish as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Inkfield 0.1.${{ github.run_number }}
          files: out/*.apk
          make_latest: true
